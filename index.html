    <style id="pavana-loader-styles">
      #pavana-initial-loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: 999999;
        background: #14251E;
        background: radial-gradient(circle at 50% 50%, #064A32 0%, #14251E 70%, #0B1612 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: #F8F6ED;
        transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.3s;
        overflow: hidden;
      }
      #pavana-initial-loader.pavana-loader-fade {
        opacity: 0 !important;
        visibility: hidden !important;
        pointer-events: none !important;
      }
      .pavana-init-bg-grid {
        position: absolute;
        inset: 0;
        background-image: 
          linear-gradient(to right, rgba(198, 154, 54, 0.08) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(198, 154, 54, 0.08) 1px, transparent 1px);
        background-size: 40px 40px;
        pointer-events: none;
        opacity: 0.15;
      }
      .pavana-init-center {
        position: relative;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 0 24px;
      }
      .pavana-init-logo-wrap {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: pavanaInitLogoFloat 3s ease-in-out infinite;
      }
      .pavana-init-aura {
        position: absolute;
        width: 280px;
        height: 140px;
        background: radial-gradient(circle, rgba(198, 154, 54, 0.28) 0%, rgba(6, 74, 50, 0.3) 50%, transparent 70%);
        filter: blur(28px);
        pointer-events: none;
        animation: pavanaInitAuraPulse 2.6s ease-in-out infinite;
      }
      .pavana-init-logo-container {
        position: relative;
        overflow: hidden;
        padding: 6px;
        border-radius: 4px;
      }
      .pavana-init-logo {
        height: 60px;
        width: auto;
        object-fit: contain;
        position: relative;
        z-index: 2;
        filter: drop-shadow(0 4px 20px rgba(0, 0, 0, 0.6));
      }
      .pavana-init-sheen {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(105deg, transparent 20%, rgba(223, 190, 101, 0.4) 50%, transparent 80%);
        mix-blend-mode: screen;
        pointer-events: none;
        animation: pavanaInitSheenSweep 2.4s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
        z-index: 3;
      }
      .pavana-init-line-wrap {
        margin-top: 18px;
        width: 110px;
        height: 1.5px;
        background: #1F382E;
        border-radius: 9999px;
        overflow: hidden;
        position: relative;
      }
      .pavana-init-line {
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, #9A7420 0%, #DFBE65 50%, #9A7420 100%);
        border-radius: 9999px;
        box-shadow: 0 0 8px rgba(223, 190, 101, 0.8);
        animation: pavanaInitUnderlineSweep 1.8s cubic-bezier(0.16, 1, 0.3, 1) infinite;
      }
      @keyframes pavanaInitLogoFloat {
        0%, 100% {
          transform: translateY(0px) scale(1);
        }
        50% {
          transform: translateY(-4px) scale(1.02);
        }
      }
      @keyframes pavanaInitAuraPulse {
        0%, 100% {
          opacity: 0.35;
          transform: scale(0.92);
        }
        50% {
          opacity: 0.85;
          transform: scale(1.2);
        }
      }
      @keyframes pavanaInitSheenSweep {
        0% {
          transform: translateX(-160%) skewX(-25deg);
          opacity: 0;
        }
        20% {
          opacity: 0.9;
        }
        60% {
          transform: translateX(180%) skewX(-25deg);
          opacity: 0;
        }
        100% {
          transform: translateX(180%) skewX(-25deg);
          opacity: 0;
        }
      }
      @keyframes pavanaInitUnderlineSweep {
        0% {
          transform: scaleX(0);
          opacity: 0;
        }
        45% {
          transform: scaleX(0.7);
          opacity: 1;
        }
        85%, 100% {
          transform: scaleX(1);
          opacity: 0.9;
        }
      }
      @media (max-width: 640px) {
        .pavana-init-logo { height: 48px; }
        .pavana-init-line-wrap { width: 90px; }
      }
      @media (prefers-reduced-motion: reduce) {
        .pavana-init-logo-wrap,
        .pavana-init-aura,
        .pavana-init-sheen,
        .pavana-init-line {
          animation: none !important;
        }
        .pavana-init-line {
          transform: scaleX(1) !important;
          opacity: 1 !important;
        }
        #pavana-initial-loader {
          transition: none !important;
        }
      }
    </style>

  <body class="bg-[#F8F6ED] text-[#14251E] font-sans antialiased selection:bg-[#064A32] selection:text-[#DFBE65]">

    <!-- Initial Website Loading Screen (Authentic Pavana Projects Branded - Logo Only) -->
    <div id="pavana-initial-loader" role="status" aria-live="polite" aria-label="Loading Pavana Projects">
      <div class="pavana-init-bg-grid" aria-hidden="true"></div>
      
      <div class="pavana-init-center">
        <div class="pavana-init-logo-wrap">

              src="/logo-white.png"

              class="pavana-init-logo" 
              width="340" 
              height="90" 
              fetchpriority="high"
            />
            <div class="pavana-init-sheen" aria-hidden="true"></div>

        <div class="pavana-init-line-wrap" aria-hidden="true">
          <div class="pavana-init-line"></div>
        </div>
      </div>
    </div>

    <!-- Pre-Mount Loader Dismissal & Fail-safe Script -->
    <script>
      window.__dismissPavanaInitialLoader = function() {
        var loader = document.getElementById('pavana-initial-loader');
        if (!loader || loader.getAttribute('data-dismissed') === 'true') return;
        loader.setAttribute('data-dismissed', 'true');
        loader.classList.add('pavana-loader-fade');
        setTimeout(function() {
          if (loader && loader.parentNode) {
            loader.parentNode.removeChild(loader);
          }
          var styles = document.getElementById('pavana-loader-styles');
          if (styles && styles.parentNode) {
            styles.parentNode.removeChild(styles);
          }
        }, 380);
      };

      // Fail-safe timeout: Ensure user is NEVER trapped behind loader under network or script failure
      setTimeout(function() {
        if (typeof window.__dismissPavanaInitialLoader === 'function') {
          window.__dismissPavanaInitialLoader();
        }
      }, 4200);
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
